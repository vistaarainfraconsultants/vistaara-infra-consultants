# Keeps content.js in step with images/, projects/ and careers/.
# Add a photo, project or job on GitHub → this rebuilds the list → the website shows it.
name: Update website content list

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "projects/**"
      - "careers/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update-content.py
      - name: Commit content.js if it changed
        run: |
          if git diff --quiet -- content.js; then
            echo "content.js already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add content.js
            git commit -m "Update website content list"
            git push
          fi
